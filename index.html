<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מחולל חתימות למייל | ORT סינגאלובסקי</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#10264a;--muted:#64748b;--line:#dbe5f0;--blue:#0878c9;--cyan:#12b8e8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif;line-height:1.5}
.wrap{max-width:1120px;margin:auto;padding:24px 16px 40px}
h1{font-size:24px;margin:0 0 4px}.sub{margin:0 0 20px;color:var(--muted);font-size:14px}
.layout{display:grid;grid-template-columns:minmax(280px,420px) 1fr;gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 5px 18px #16345a0a}
h2{font-size:16px;margin:0 0 12px}
label{display:block;color:var(--muted);font-size:12px;margin:10px 0 4px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--tx);font:inherit;font-size:14px}
input[type=color]{height:40px;padding:3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
button{cursor:pointer;border:0;border-radius:9px;padding:11px 15px;font:inherit;font-weight:bold;background:var(--blue);color:#fff}
button.secondary{background:#fff;color:var(--tx);border:1px solid var(--line)}
button:focus,input:focus,select:focus{outline:2px solid #73c9ef;outline-offset:1px}
.preview{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;overflow:auto;min-height:220px}
.preview-inner{min-width:500px}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.status{min-height:20px;color:var(--blue);font-size:13px;margin-top:8px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.preview{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>מחולל חתימות למייל</h1>
  <p class="sub">חתימה מודרנית בסגנון ORT סינגאלובסקי — פרטים ניתנים לעריכה, לוגו קבוע והעתקה ל-Gmail או Outlook.</p>
  <div class="layout">
    <section class="card">
      <h2>פרטי העובד</h2>
      <label>שם מלא</label><input id="name" value="אלעד רובינוב">
      <label>תפקיד 1</label><input id="role" value="טכנאי מחשבים – אורט סינגאלובסקי">
      <label>תפקיד 2 (אופציונלי)</label><input id="role2">
      <label>תפקיד 3 (אופציונלי)</label><input id="role3">
      <label>דוא״ל</label><input id="mail" value="1005340030@ort.edu.gov.il" dir="ltr">
      <label>כתובת</label><input id="address" value="דרך הטייסים 28, תל אביב">
      <label>נייד</label><input id="phone" value="054-4945795" dir="ltr">
      <div class="row">
        <div><label>צבע מוביל</label><input id="color" type="color" value="#176ab2"></div>
        <div><label>רוחב הלוגו (פיקסלים)</label><input id="logoWidth" type="number" min="100" max="320" value="230"></div>
      </div>
      <label>מיקום הלוגו</label>
      <select id="logoSide"><option value="left">שמאל</option><option value="right">ימין</option></select>
      <label>לוגו חלופי (אופציונלי)</label>
      <input id="logoFile" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml">
      <div class="actions"><button class="secondary" id="resetLogo" type="button">חזרה ללוגו הקבוע</button></div>
      <p class="note">לוגו חלופי נשמר בדפדפן זה.</p>
    </section>

    <section class="card">
      <h2>סגנון חתימה</h2>
      <label>בחר עיצוב</label>
      <select id="styleMode">
        <option value="wide">עיצוב ORT – לוגו גדול ופרטים מפורטים</option>
        <option value="compact">עיצוב קומפקטי – כמו בדוגמה החדשה</option>
      </select>
      <div style="height:12px"></div>
      <h2>תצוגה מקדימה</h2>
      <div class="preview"><div class="preview-inner" id="preview"></div></div>
      <div class="actions">
        <button id="copySignature" type="button">העתק חתימה</button>
        <button class="secondary" id="copyHtml" type="button">העתק קוד HTML</button>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
      <p class="note"><b>Gmail:</b> הגדרות ← הצג את כל ההגדרות ← חתימה ← הדבק.<br><b>Outlook:</b> הגדרות חתימות ← הדבק.</p>
    </section>
  </div>
</div>

let logo = DEFAULT_LOGO;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const validLogo = l => /^(data:image\/|https?:)/i.test(l || '');

function render(){
  const name=$('name').value.trim();
  const roles=['role','role2','role3'].map(id=>$(id).value.trim()).filter(Boolean);
  const mail=$('mail').value.trim(), address=$('address').value.trim(), phone=$('phone').value.trim();
  const color=$('color').value;
  const width=Math.max(100,Math.min(320,parseInt($('logoWidth').value,10)||230));
  const mode=$('styleMode').value, side=$('logoSide').value;
  const logoOk=validLogo(logo);
  // בטבלת RTL התא הראשון מופיע בצד ימין
  const arrange=(details,sep,logoCell)=>!logoOk?details:(side==='right'?logoCell+sep+details:details+sep+logoCell);
  const img=w=>'<img src="'+logo+'" alt="לוגו ORT סינגאלובסקי" width="'+w+'" style="display:block;width:'+w+'px;max-width:'+w+'px;height:auto;border:0;">';

  let html;
  if(mode==='compact'){
    const cw=Math.min(width,155);
    const inline=[];
    if(phone) inline.push('<span dir="ltr">'+esc(phone)+'</span> <span style="color:'+color+';">☎</span>');
    if(mail) inline.push('<a href="mailto:'+esc(mail)+'" dir="ltr" style="color:#536987;text-decoration:none;">'+esc(mail)+'</a> <span style="color:'+color+';">✉</span>');
    const details='<td valign="middle" style="text-align:right;padding:2px 18px;min-width:250px;">'+
      '<div style="font-size:19px;font-weight:bold;color:'+color+';line-height:1.35;">'+esc(name)+'</div>'+
      roles.map(r=>'<div style="font-size:12px;color:#536987;line-height:1.6;">'+esc(r)+'</div>').join('')+
      (address?'<div style="font-size:12px;color:#536987;line-height:1.6;">'+esc(address)+'</div>':'')+
      '<div style="font-size:11px;color:#536987;line-height:1.8;margin-top:3px;">'+inline.join(' &nbsp; ')+'</div></td>';
    const sep='<td width="2" style="width:2px;background:'+color+';font-size:0;line-height:0;">&nbsp;</td>';
    const logoCell='<td valign="middle" style="width:'+cw+'px;text-align:center;padding:0 12px;">'+img(cw)+'</td>';
    html='<table dir="rtl" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:650px;border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;"><tr>'+arrange(details,sep,logoCell)+'</tr></table>';
  } else {
    const contact=[];
    if(mail) contact.push('<div><span style="color:'+color+';font-weight:bold;">דוא״ל:</span> <a href="mailto:'+esc(mail)+'" dir="ltr" style="color:#536987;text-decoration:none;">'+esc(mail)+'</a></div>');
    if(address) contact.push('<div><span style="color:'+color+';font-weight:bold;">כתובת:</span> '+esc(address)+'</div>');
    if(phone) contact.push('<div><span style="color:'+color+';font-weight:bold;">נייד:</span> <a href="tel:'+esc(phone.replace(/[^\d+]/g,''))+'" dir="ltr" style="color:#536987;text-decoration:none;">'+esc(phone)+'</a></div>');
    const details='<td valign="middle" style="padding:4px 18px;text-align:right;color:#10264a;">'+
      '<div style="font-size:20px;font-weight:bold;color:#10264a;margin-bottom:4px;">'+esc(name)+'</div>'+
      '<div style="font-size:14px;color:'+color+';font-weight:bold;margin-bottom:10px;line-height:1.5;">'+roles.map(esc).join('<br>')+'</div>'+
      '<div style="border-top:1px solid #d9e4ef;margin:8px 0;"></div>'+
      '<div style="font-size:13px;line-height:1.8;color:#10264a;">'+contact.join('')+'</div>'+
      '<div style="font-size:13px;font-weight:bold;color:'+color+';margin-top:9px;">ביחד לחינוך מצוינות</div></td>';
    const sep='<td width="4" style="width:4px;background:#397dbb;border-radius:4px;"></td>';
    const logoCell='<td valign="middle" style="width:'+width+'px;text-align:center;padding:0 12px;">'+img(width)+'</td>';
    html='<table dir="rtl" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:760px;border-collapse:collapse;direction:rtl;font-family:Arial,Helvetica,sans-serif;"><tr>'+arrange(details,sep,logoCell)+'</tr></table>';
  }
  $('preview').innerHTML=html;
}
function say(t){$('status').textContent=t;setTimeout(()=>{$('status').textContent=''},3000)}
['name','role','role2','role3','mail','address','phone','color','logoWidth'].forEach(id=>$(id).addEventListener('input',render));
$('styleMode').addEventListener('change',render);
$('logoSide').addEventListener('change',render);
$('logoFile').addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file)return;
  if(!file.type.startsWith('image/')){say('יש לבחור קובץ תמונה.');return}
  if(file.size>2*1024*1024){say('גודל הקובץ חייב להיות עד 2MB.');return}
  const reader=new FileReader();
  reader.onload=()=>{
    logo=reader.result;
    try{localStorage.setItem('ortSignatureLogo',logo)}catch(err){}
    render();say('הלוגו הוחלף ונשמר בדפדפן.');
  };
  reader.readAsDataURL(file);
});
$('resetLogo').addEventListener('click',()=>{
  logo=DEFAULT_LOGO;
  try{localStorage.removeItem('ortSignatureLogo')}catch(err){}
  $('logoFile').value='';render();say('הלוגו המקורי הוחזר.');
});
try{logo=localStorage.getItem('ortSignatureLogo')||DEFAULT_LOGO}catch(err){}
$('copySignature').addEventListener('click',async()=>{
  const table=$('preview').querySelector('table');
  try{
    if(navigator.clipboard&&window.ClipboardItem){
      await navigator.clipboard.write([new ClipboardItem({
        'text/html':new Blob([table.outerHTML],{type:'text/html'}),
        'text/plain':new Blob([table.innerText],{type:'text/plain'})
      })]);
      say('החתימה הועתקה. הדבק אותה בהגדרות המייל.');
    }else{
      const range=document.createRange();range.selectNodeContents(table);
      const sel=getSelection();sel.removeAllRanges();sel.addRange(range);
      const ok=document.execCommand('copy');sel.removeAllRanges();
      say(ok?'החתימה הועתקה.':'ההעתקה נחסמה בדפדפן.');
    }
  }catch(e){say('ההעתקה נחסמה. נסה להעתיק ידנית מהתצוגה.')}
});
$('copyHtml').addEventListener('click',async()=>{
  const html=$('preview').querySelector('table').outerHTML;
  try{await navigator.clipboard.writeText(html);say('קוד ה-HTML הועתק.')}
  catch(e){
    const ta=document.createElement('textarea');ta.value=html;document.body.appendChild(ta);
    ta.select();const ok=document.execCommand('copy');ta.remove();say(ok?'קוד ה-HTML הועתק.':'ההעתקה נחסמה.');
  }
});
render();
</script>
</body>
</html>
