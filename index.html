<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>מחולל חתימות למייל</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--ac:#1f6feb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#1a2130;--tx:#f3f4f6;--mu:#9ca3af;--bd:#2b3548;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#1a2130;--tx:#f3f4f6;--mu:#9ca3af;--bd:#2b3548;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif;line-height:1.5}
.w{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 18px;font-size:14px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.g{grid-template-columns:1fr}}
.c{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px}
.c h2{font-size:15px;margin:0 0 12px}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 3px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;font-size:14px}
input[type=color]{padding:2px;height:38px}
.r{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.t{display:flex;gap:8px;flex-wrap:wrap}
.t button{flex:1;min-width:80px;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.t button.on{border-color:var(--ac);background:var(--ac);color:#fff}
.pv{background:#fff;color:#111;border:1px solid var(--bd);border-radius:10px;padding:20px;overflow-x:auto;min-height:180px}
.b{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.b button{flex:1;padding:11px;border:0;border-radius:8px;font:inherit;font-weight:bold;cursor:pointer;background:var(--ac);color:#fff}
.b button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.m{font-size:13px;color:var(--mu);margin-top:8px;min-height:18px}
.hw{font-size:13px;color:var(--mu);margin-top:14px;line-height:1.7}
</style>
</head>
<body>
<div class="w">
<h1>מחולל חתימות למייל</h1>
<p class="sub">ממלאים פרטים, בוחרים עיצוב וצבע, ומעתיקים ישר ל-Gmail או Outlook.</p>
<div class="g">
<div class="c">
<h2>הפרטים שלכם</h2>
<label>שם מלא</label><input id="name" value="דנה כהן">
<div class="r"><div><label>תפקיד</label><input id="role" value="מנהלת שיווק"></div><div><label>חברה</label><input id="co" value="סטודיו כהן"></div></div>
<div class="r"><div><label>טלפון</label><input id="tel" value="050-123-4567" dir="ltr"></div><div><label>מייל</label><input id="mail" value="dana@example.co.il" dir="ltr"></div></div>
<label>אתר</label><input id="web" value="www.example.co.il" dir="ltr">
<label>כתובת (אופציונלי)</label><input id="adr" value="רחוב הדוגמה 1, תל אביב">
<label>LinkedIn (אופציונלי)</label><input id="li" placeholder="linkedin.com/in/..." dir="ltr">
<div class="r"><div><label>טקסט כפתור (אופציונלי)</label><input id="btn" value="לקביעת פגישה"></div><div><label>קישור הכפתור</label><input id="bl" value="calendly.com/yourname" dir="ltr"></div></div>
<div class="r"><div><label>צבע</label><input id="col" type="color" value="#1f6feb"></div><div><label>כיוון</label><select id="dir"><option value="rtl">עברית (ימין לשמאל)</option><option value="ltr">English (LTR)</option></select></div></div>
</div>
<div>
<div class="c">
<h2>עיצוב</h2>
<div class="t" id="tp"><button data-t="1" class="on">קלאסי</button><button data-t="2">מודרני</button><button data-t="3">מינימלי</button></div>
</div>
<div class="c" style="margin-top:16px">
<h2>תצוגה מקדימה</h2>
<div class="pv" id="pv"></div>
<div class="b"><button id="cp">העתק חתימה</button><button id="ch" class="s">העתק קוד HTML</button></div>
<div class="m" id="msg"></div>
<div class="hw"><b>Gmail:</b> הגדרות ← הצג את כל ההגדרות ← חתימה ← הדביקו.<br><b>Outlook:</b> קובץ ← אפשרויות ← דואר ← חתימות ← הדביקו.</div>
</div>
</div>
</div>
</div>
<script>
var tpl="1",$=function(i){return document.getElementById(i)};
function esc(s){return s.replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function url(u){return /^(https?:|mailto:|tel:)/.test(u)?u:"https://"+u}
function build(){
var v={};["name","role","co","tel","mail","web","adr","li","btn","bl","col","dir"].forEach(function(k){v[k]=$(k).value.trim()});
var rtl=v.dir==="rtl",al=rtl?"right":"left",ac=v.col,F="font-family:Arial,Helvetica,sans-serif;";
var L=rtl?{t:"טל׳",m:"מייל",w:"אתר",a:"כתובת"}:{t:"Tel",m:"Email",w:"Web",a:"Address"};
var lk=function(h,tx,d){return '<a href="'+esc(h)+'" style="color:#374151;text-decoration:none;"'+(d?' dir="ltr"':'')+'>'+esc(tx)+'</a>'};
var rows=[];
if(v.tel)rows.push([L.t,lk("tel:"+v.tel.replace(/[^\d+]/g,""),v.tel,1)]);
if(v.mail)rows.push([L.m,lk("mailto:"+v.mail,v.mail,1)]);
if(v.web)rows.push([L.w,lk(url(v.web),v.web,1)]);
if(v.adr)rows.push([L.a,esc(v.adr)]);
var det='<table cellpadding="0" cellspacing="0" border="0" style="'+F+'font-size:13px;color:#374151;">'+rows.map(function(r){return '<tr><td style="padding:2px 0 2px '+(rtl?'10':'0')+'px;padding-right:'+(rtl?'0':'10')+'px;color:'+ac+';font-weight:bold;">'+r[0]+'</td><td style="padding:2px 0;">'+r[1]+'</td></tr>'}).join("")+'</table>';
var btn=(v.btn&&v.bl)?'<table cellpadding="0" cellspacing="0" border="0" style="margin-top:14px;"><tr><td style="background-color:'+ac+';border-radius:6px;padding:8px 18px;"><a href="'+esc(url(v.bl))+'" style="'+F+'color:#ffffff;font-size:13px;font-weight:bold;text-decoration:none;">'+esc(v.btn)+(rtl?' ←':' →')+'</a></td></tr></table>':"";
var li=v.li?'<div style="margin-top:10px;font-size:12px;'+F+'"><a href="'+esc(url(v.li))+'" style="color:'+ac+';text-decoration:none;font-weight:bold;">LinkedIn</a></div>':"";
var sub=esc(v.role)+(v.role&&v.co?" | ":"")+esc(v.co);
var o='<table dir="'+v.dir+'" cellpadding="0" cellspacing="0" border="0" style="'+F+'direction:'+v.dir+';text-align:'+al+';">';
if(tpl==="1"){
o+='<tr><td style="width:4px;background-color:'+ac+';border-radius:4px;"></td><td style="padding:4px 18px;"><div style="font-size:20px;font-weight:bold;color:#111827;line-height:1.2;">'+esc(v.name)+'</div><div style="font-size:13px;color:'+ac+';font-weight:bold;margin-top:3px;">'+esc(v.role)+'</div><div style="font-size:13px;color:#6b7280;margin-top:2px;">'+esc(v.co)+'</div><div style="height:1px;background-color:#e5e7eb;margin:12px 0;width:260px;"></div>'+det+btn+li+'</td></tr>';
}else if(tpl==="2"){
var ini=v.name.split(/\s+/).slice(0,2).map(function(w){return w.charAt(0)}).join("");
o+='<tr><td style="vertical-align:top;padding-'+(rtl?'left':'right')+':16px;"><table cellpadding="0" cellspacing="0" border="0"><tr><td width="64" height="64" align="center" style="width:64px;height:64px;background-color:'+ac+';border-radius:32px;color:#ffffff;font-size:22px;font-weight:bold;'+F+'">'+esc(ini)+'</td></tr></table></td><td style="vertical-align:top;border-'+(rtl?'right':'left')+':1px solid #e5e7eb;padding:2px 16px;"><div style="font-size:19px;font-weight:bold;color:#111827;">'+esc(v.name)+'</div><div style="font-size:13px;color:#6b7280;margin:2px 0 10px;">'+sub+'</div>'+det+btn+li+'</td></tr>';
}else{
o+='<tr><td style="padding:2px 0;"><div style="font-size:16px;font-weight:bold;color:#111827;">'+esc(v.name)+'</div><div style="font-size:13px;color:#6b7280;margin:2px 0 8px;">'+sub+'</div><div style="height:2px;width:40px;background-color:'+ac+';margin-bottom:8px;"></div><div style="font-size:13px;color:#374151;">'+rows.filter(function(r){return r[0]!==L.a}).map(function(r){return r[1]}).join('<span style="color:#d1d5db;"> &nbsp;|&nbsp; </span>')+'</div>'+(v.adr?'<div style="font-size:12px;color:#9ca3af;margin-top:4px;">'+esc(v.adr)+'</div>':'')+li+'</td></tr>';
}
return o+'</table>';
}
function render(){$("pv").innerHTML=build()}
function say(t){$("msg").textContent=t;setTimeout(function(){$("msg").textContent=""},3000)}
function fallbackCopy(){var r=document.createRange();r.selectNodeContents($("pv"));var s=getSelection();s.removeAllRanges();s.addRange(r);var ok=false;try{ok=document.execCommand("copy")}catch(e){}s.removeAllRanges();return ok}
$("cp").onclick=function(){
var html=build();
if(navigator.clipboard&&window.ClipboardItem){
navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([html],{type:"text/html"}),"text/plain":new Blob([$("pv").innerText],{type:"text/plain"})})]).then(function(){say("החתימה הועתקה. עכשיו מדביקים בהגדרות המייל.")}).catch(function(){say(fallbackCopy()?"החתימה הועתקה.":"ההעתקה נחסמה. סמנו את התצוגה המקדימה והעתיקו ידנית.")});
}else say(fallbackCopy()?"החתימה הועתקה.":"ההעתקה נחסמה. סמנו את התצוגה המקדימה והעתיקו ידנית.");
};
$("ch").onclick=function(){
var h=build();
function fb(){var a=document.createElement("textarea");a.value=h;document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}a.remove();say(ok?"קוד ה-HTML הועתק.":"ההעתקה נחסמה.")}
if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(h).then(function(){say("קוד ה-HTML הועתק.")}).catch(fb);else fb();
};
document.querySelectorAll("#tp button").forEach(function(b){b.onclick=function(){tpl=b.dataset.t;document.querySelectorAll("#tp button").forEach(function(x){x.classList.toggle("on",x===b)});render()}});
document.querySelectorAll("input,select").forEach(function(e){e.addEventListener("input",render)});
render();
</script>
</body>
</html>
